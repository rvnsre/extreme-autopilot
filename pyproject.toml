[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "extreme-autopilot"
version = "0.1.0"
description = "One brief, bounded autonomous execution in an isolated Windows worker"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "filelock>=3.16,<5", "cryptography>=44,<49"]

[project.optional-dependencies]
worker = ["playwright>=1.50,<2", "pillow>=11,<14", "pywinauto==0.6.9; sys_platform == 'win32'", "pyautogui==0.9.54", "pyperclip>=1.9,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autopilot = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
