[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "extreme-autopilot"
version = "0.4.0"
description = "One brief, bounded autonomous execution on Windows, Linux and macOS"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "filelock>=3.16,<5", "cryptography>=44,<49"]

[project.optional-dependencies]
economy = ["orjson==3.13.0", "tiktoken==0.14.0", "cachetools==8.0.0", "diskcache==5.6.3", "xxhash==4.1.0", "zstandard==0.25.0", "blake3==1.0.11", "regex==2026.11.9", "ftfy==6.3.1", "beautifulsoup4==4.15.0", "lxml==6.1.3", "trafilatura==2.3.1", "markdownify==1.2.3", "rapidfuzz==3.14.6", "datasketch==2.0.0", "rank-bm25==0.2.2", "snowballstemmer==3.1.1", "msgspec==0.22.0", "jsonschema==4.26.0", "jsonpatch==1.45", "jmespath==1.1.0", "boltons==26.2.0"]
worker = ["playwright>=1.50,<2", "pillow>=11,<14", "pywinauto==0.6.9; sys_platform == 'win32'", "pyautogui==0.9.54; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autopilot = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
