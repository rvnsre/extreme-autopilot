name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock.txt -r requirements-economy.lock.txt
      - run: python -m pip check
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -c "from autopilot.economy import library_status; assert len(library_status()) == 22"
      - run: ruff check .
      - run: pytest --cov=autopilot --cov-report=term-missing
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m build --no-isolation
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install chromium
      - if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - if: runner.os == 'Linux'
        name: Allow Chromium user namespaces on the disposable AppArmor runner
        run: |
          cat > /tmp/autopilot-playwright.apparmor <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile autopilot-playwright /home/runner/.cache/ms-playwright/**/chrome* flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /tmp/autopilot-playwright.apparmor
      - run: pytest tests/test_browser_live.py -v
        env:
          EA_TEST_BROWSER: '1'
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox wmctrl xdotool xterm
      - run: python -m pip install -r requirements-worker.lock.txt -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: xvfb-run -a bash scripts/test-linux-desktop.sh
